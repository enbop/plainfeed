[workspace]
members = [
    "crates/plainfeed-core",
    "crates/plainfeed-server",
    "crates/plainfeed-sync-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/spore-bot/plainfeed"

[workspace.dependencies]
plainfeed-core = { path = "crates/plainfeed-core" }
plainfeed-sync-core = { path = "crates/plainfeed-sync-core" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
toml = "0.9.8"
