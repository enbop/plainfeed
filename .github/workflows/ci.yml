name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and build WASIp2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and WASIp2 target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustup target add wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build release component
        env:
          RUSTFLAGS: --cfg tokio_unstable
        run: cargo build --locked --release -p plainfeed-service --target wasm32-wasip2

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and WASIp2 target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-wasip2

      - name: Build release component
        env:
          RUSTFLAGS: --cfg tokio_unstable
        run: cargo build --locked --release -p plainfeed-service --target wasm32-wasip2

      - name: Package release assets
        run: |
          mkdir dist
          cp target/wasm32-wasip2/release/plainfeed-service.wasm dist/
          cp packaging/plainfeed-release.fungi.md dist/plainfeed.fungi.md
          cd dist
          sha256sum plainfeed-service.wasm plainfeed.fungi.md > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/plainfeed-service.wasm \
            dist/plainfeed.fungi.md \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Plainfeed $GITHUB_REF_NAME" \
            --generate-notes
